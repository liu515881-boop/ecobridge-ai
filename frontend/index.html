<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecobridge AI - 废旧金属智能识别平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 语言切换器 -->
    <div class="language-selector" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
        <select id="languageSelect" onchange="changeLanguage()" style="padding: 8px 12px; border-radius: 5px; border: 1px solid #ddd; background: white; cursor: pointer;">
            <option value="zh">🇨🇳 中文</option>
            <option value="en">🇬🇧 English</option>
            <option value="ar">🇦🇪 العربية</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="ur">🇵🇰 اردو</option>
        </select>
    </div>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <span class="logo-icon">♻️</span>
                <span class="logo-text">Ecobridge AI</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-link active" data-i18n="nav_identify">识别</a>
                <a href="#" class="nav-link" data-i18n="nav_history">历史记录</a>
                <a href="#" class="nav-link" data-i18n="nav_about">关于</a>
            </nav>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <div class="container">
            <!-- 页面标题 -->
            <section class="page-header">
                <h1 data-i18n="title_identify">金属识别</h1>
                <p data-i18n="subtitle_identify">上传废金属照片，AI 自动识别金属类型和杂质含量</p>
            </section>

            <!-- 上传区域 -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <div class="upload-content" id="uploadContent">
                        <div class="upload-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                            </svg>
                        </div>
                        <h3 class="upload-title" data-i18n="upload_click">点击或拖拽图片到此处</h3>
                        <p class="upload-hint" data-i18n="upload_hint">支持 JPG、PNG 格式，最大 10MB</p>
                    </div>
                    <div class="image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" src="" alt="预览">
                        <button class="remove-btn" id="removeBtn" type="button" title="移除图片">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 加载状态 -->
            <section class="loading-section" id="loadingSection" style="display: none;">
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <p class="loading-text">正在分析图片，请稍候...</p>
            </section>

            <!-- 错误提示 -->
            <section class="error-section" id="errorSection" style="display: none;">
                <div class="error-card">
                    <div class="error-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v4M12 16h.01"/>
                        </svg>
                    </div>
                    <p class="error-message" id="errorMessage">识别失败，请重试</p>
                </div>
            </section>

            <!-- 识别结果 -->
            <section class="result-section" id="resultSection" style="display: none;">
                <h2 class="section-title">识别报告</h2>
                
                <div class="report-card">
                    <!-- 报告头部 -->
                    <div class="report-header">
                        <div class="report-thumbnail">
                            <img id="resultImg" src="" alt="识别图片">
                        </div>
                        <div class="report-main">
                            <div class="metal-info">
                                <span class="metal-badge" id="metalBadge">铜</span>
                                <span class="metal-name-en" id="metalNameEn">Copper</span>
                            </div>
                            <div class="confidence-section">
                                <div class="confidence-label">置信度</div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" id="confidenceFill"></div>
                                </div>
                                <span class="confidence-value" id="confidenceValue">92%</span>
                            </div>
                        </div>
                    </div>

                    <!-- 报告详情 -->
                    <div class="report-details">
                        <div class="detail-row">
                            <span class="detail-label">杂质检测</span>
                            <div class="impurities-list" id="impuritiesList">
                                <!-- 动态生成 -->
                            </div>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">判断依据</span>
                            <p class="reason-text" id="reasonText">--</p>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">识别时间</span>
                            <span class="detail-value" id="timestamp">--</span>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="resetBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6"/>
                            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                        </svg>
                        重新识别
                    </button>
                    <button class="btn btn-primary" id="generateReportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                        </svg>
                        生成报告
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ecobridge AI. 专业的废旧金属识别平台</p>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
